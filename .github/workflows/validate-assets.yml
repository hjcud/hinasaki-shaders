name: Validate assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Asset integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate metadata, references, and distribution notices
        run: python3 scripts/validate_assets.py
